[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raydium"
version = "2.0.0"
description = "Mapping Ideal Solar Plant Locations and Solar Potential across India using NASA POWER API and Geospatial Analytics"
readme = "README.md"
authors = [
    { name = "abhy-kumar", email = "abhiks177@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["solar", "india", "renewable-energy", "gis", "nasa-power", "geopandas", "rasterio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "scipy>=1.10.0",
    "rasterio>=1.3.0",
    "pyproj>=3.4.0",
    "affine>=2.4.0",
    "matplotlib>=3.7.0",
    "folium>=0.14.0",
    "branca>=0.6.0",
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
    "diskcache>=5.4.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
raydium = "raydium.cli:app"

[project.urls]
Homepage = "https://github.com/abhy-kumar/Raydium"
Repository = "https://github.com/abhy-kumar/Raydium.git"
Issues = "https://github.com/abhy-kumar/Raydium/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
