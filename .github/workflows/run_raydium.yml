name: Daily Solar Intelligence & Siting Pipeline

on:
  push:
    branches: [ main, master ]
  schedule:
    # Run daily at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      resolution:
        description: 'Grid resolution in degrees (e.g. 0.25 for ~25km, 0.1 for ~10km)'
        required: false
        default: '0.25'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-solar-data:
    name: Generate Solar Suitability Data & Maps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Geospatial Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev libgdal-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Solar Siting Engine
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running full NASA POWER API data collection pipeline..."
            raydium pipeline --resolution ${{ github.event.inputs.resolution || '0.25' }} --verbose
          else
            echo "Fast build and GIS visualization from repository solar data..."
            raydium visualize --data india_solar_data.csv --grid-res 600
          fi
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solar-intelligence-artifacts
          path: |
            india_solar_data.csv
            solar_potential_high_res.png
            index.html
            india_solar_potential.html

      - name: Commit & Push Data (on scheduled updates)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add india_solar_data.csv solar_potential_high_res.png index.html india_solar_potential.html
          git diff --staged --quiet || (
            git commit -m "Automated daily solar potential & plant suitability update [skip ci]" &&
            git pull --rebase origin main &&
            git push origin main
          )

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: generate-solar-data
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
